# OpenVoiceSpeak server with the .NET Aspire Dashboard: traces, metrics and logs, kept in memory only.
#   docker compose up -d --build      then the dashboard at http://localhost:18888
#   docker compose down -v            stops it and removes its data
# ovs-server is built from this checkout; for a release image with telemetry use
#   image: ghcr.io/rezondes/openvoicespeak-server:<version>   and remove the build line.
services:
  ovs-server:
    build: ../../..
    image: openvoicespeak/server:local
    restart: unless-stopped
    ports:
      - "7000:7000/tcp"
      - "7000:7000/udp"
    environment:
      OVS_SERVER_NAME: "Mein Server"
      TZ: "Europe/Berlin"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    volumes:
      - ovs-data:/data
    depends_on:
      - aspire-dashboard

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.1
    restart: unless-stopped
    ports:
      - "18888:18888"
    environment:
      # a local example: no login; put the dashboard behind authentication before you expose it
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"

volumes:
  ovs-data:
