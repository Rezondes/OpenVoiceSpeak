# OpenVoiceSpeak server with Seq: logs and traces (Seq takes no metrics; those exports are refused and dropped).
#   docker compose up -d --build      then Seq at http://localhost:5380
#   docker compose down -v            stops it and removes its data
# ovs-server is built from this checkout; for a release image with telemetry use
#   image: ghcr.io/rezondes/openvoicespeak-server:<version>   and remove the build line.
services:
  ovs-server:
    build: ../../..
    image: openvoicespeak/server:local
    restart: unless-stopped
    ports:
      - "7000:7000/tcp"
      - "7000:7000/udp"
    environment:
      OVS_SERVER_NAME: "Mein Server"
      TZ: "Europe/Berlin"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://seq:5341/ingest/otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
    volumes:
      - ovs-data:/data
    depends_on:
      - seq

  seq:
    image: datalust/seq:2026.1.17182
    restart: unless-stopped
    ports:
      - "5380:80"
    environment:
      ACCEPT_EULA: "Y"
      # a local example: no login; set SEQ_FIRSTRUN_ADMINPASSWORD instead before you expose it
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - seq-data:/data

volumes:
  ovs-data:
  seq-data:
