# OpenVoiceSpeak server with Elastic: Elasticsearch, Kibana and the EDOT Collector (Elastic's OpenTelemetry collector,
# with the APM connector so Kibana's APM pages show the server): traces, metrics and logs.
#   docker compose up -d --build      then Kibana at http://localhost:5601 (Observability, APM, Discover)
#   docker compose down -v            stops it and removes its data
# LOCAL EXAMPLE ONLY: Elasticsearch runs with its security switched off (no password, no TLS). Before you expose it,
# switch xpack.security on and give Kibana and the collector credentials. Elasticsearch takes about 2 GB of RAM; on Linux
# the host needs vm.max_map_count of at least 262144 (sudo sysctl -w vm.max_map_count=262144).
# ovs-server is built from this checkout; for a release image with telemetry use
#   image: ghcr.io/rezondes/openvoicespeak-server:<version>   and remove the build line.
services:
  ovs-server:
    build: ../../..
    image: openvoicespeak/server:local
    restart: unless-stopped
    ports:
      - "7000:7000/tcp"
      - "7000:7000/udp"
    environment:
      OVS_SERVER_NAME: "Mein Server"
      TZ: "Europe/Berlin"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://edot-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    volumes:
      - ovs-data:/data
    depends_on:
      - edot-collector

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    restart: unless-stopped
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false" # local example, see the note at the top
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    depends_on:
      elasticsearch:
        condition: service_healthy

  edot-collector:
    image: docker.elastic.co/elastic-agent/elastic-otel-collector:9.5.5
    restart: unless-stopped
    command: ["--config", "/etc/edot/otel-collector.yml"]
    volumes:
      - ./otel-collector.yml:/etc/edot/otel-collector.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  ovs-data:
  elastic-data:
