# OpenVoiceSpeak server with Jaeger v2: traces (Jaeger takes no metrics or logs; those exports are refused and dropped).
#   docker compose up -d --build      then Jaeger at http://localhost:16686
#   docker compose down -v            stops it and removes its data
# ovs-server is built from this checkout; for a release image with telemetry use
#   image: ghcr.io/rezondes/openvoicespeak-server:<version>   and remove the build line.
services:
  ovs-server:
    build: ../../..
    image: openvoicespeak/server:local
    restart: unless-stopped
    ports:
      - "7000:7000/tcp"
      - "7000:7000/udp"
    environment:
      OVS_SERVER_NAME: "Mein Server"
      TZ: "Europe/Berlin"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    volumes:
      - ovs-data:/data
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    restart: unless-stopped
    ports:
      - "16686:16686"

volumes:
  ovs-data:
