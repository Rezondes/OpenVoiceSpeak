; Package 140: meson cross file for webrtc-audio-processing with zig's clang (pip package ziglang).
; Target x86_64-windows-gnu: MinGW-w64 headers, libc++ linked statically, no VCRUNTIME.
[binaries]
c = ['python', '-m', 'ziglang', 'cc', '-target', 'x86_64-windows-gnu']
cpp = ['python', '-m', 'ziglang', 'c++', '-target', 'x86_64-windows-gnu']
ar = ['python', '-m', 'ziglang', 'ar']
ranlib = ['python', '-m', 'ziglang', 'ranlib']

[built-in options]
; zig's MinGW headers claim the Windows 11 SDK level but lack windows.globalization.h,
; which abseil's time zone code includes at that level; Windows 10 is enough for OVS.
c_args = ['-DNTDDI_VERSION=0x0A000000']
cpp_args = ['-DNTDDI_VERSION=0x0A000000']

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
