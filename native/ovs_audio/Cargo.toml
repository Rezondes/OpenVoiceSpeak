[package]
name = "ovs_audio"
version = "0.1.0"
edition = "2021"
publish = false
description = "OpenVoiceSpeak's native audio engine (Package 172): a platform-neutral core and the device layers"

[lib]
# cdylib for the client, rlib for the integration tests
crate-type = ["cdylib", "rlib"]

[dependencies]
# Package 175 (A183): libopus, built from its bundled sources with CMake and linked statically
audiopus_sys = { version = "0.2.2", features = ["static"] }
# Package 178 (A184): RNNoise in pure Rust, instead of rnnoise.dll
nnnoiseless = { version = "0.5", default-features = false }

[build-dependencies]
# Package 178 (A185): compiles the AEC3 shim (only with the feature "aec")
cc = "1"

[features]
# Package 178 (A185): link WebRTC's AEC3, built by build.ps1 into target/aec (OVS_AEC_BUILD); cargo test runs without it
aec = []

[target.'cfg(windows)'.dependencies]
# Package 173 (A177): WASAPI directly, to open by MMDevice id and let Windows convert the rate (AUTOCONVERTPCM)
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[profile.release]
# panics unwind so that every export can catch them (lib.rs guard); none may cross into C#
panic = "unwind"
codegen-units = 1
lto = true
