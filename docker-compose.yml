services:
  ovs-server:
    # Package 44: the finished image from the GitHub Container Registry (amd64 and arm64).
    # Build it yourself instead: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/rezondes/openvoicespeak-server:latest
    restart: unless-stopped
    ports:
      - "7000:7000/tcp"
      - "7000:7000/udp"
    environment:
      # OVS_PORT: "7000"      # bei Änderung auch die Port-Mappings oben anpassen
      # Alle folgenden OVS_-Werte sind nur Startwerte beim allerersten Start.
      # Danach im Client unter Verwaltung, Server ändern (wirkt sofort).
      OVS_SERVER_NAME: "Mein Server"
      # OVS_MAX_USERS: "50"
      # OVS_PASSWORD: ""
      # OVS_AUTO_RESTART: "false"          # täglicher automatischer Neustart an/aus
      # OVS_AUTO_RESTART_TIME: "04:00:00"  # Uhrzeit des Neustarts (hh:mm:ss)
      # OVS_LOG_ROTATE_DAILY: "true"       # nach 00:00:00 neue Logdateien beginnen
      # OVS_LOG_DAYS: "30"                 # Aufbewahrung der Logs in Tagen, 0 = unbegrenzt
      TZ: "Europe/Berlin"   # Zeitzone für Neustart-Uhrzeit, Tageswechsel und Zeitstempel (ohne: UTC)
    volumes:
      - ovs-data:/data
    # Alternative bei UDP-Problemen hinter Docker-NAT: Host-Netzwerk statt Port-Mappings
    # network_mode: host

volumes:
  ovs-data:
